name: Build Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        shell: pwsh
        run: |
          [xml]$props=Get-Content Directory.Build.props
          $version=$props.Project.PropertyGroup.VersionPrefix
          if($props.Project.PropertyGroup.VersionSuffix){$version+='-'+$props.Project.PropertyGroup.VersionSuffix}
          if($env:GITHUB_REF_NAME -ne "v$version"){throw 'Tag and application version differ'}
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/package.ps1 -Makensis 'C:/Program Files (x86)/NSIS/makensis.exe'
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag=$env:GITHUB_REF_NAME
          $file="artifacts/Aegis-$env:APP_VERSION-Setup.exe"
          gh release create $tag $file artifacts/SHA256SUMS.txt --draft --title "Aegis $env:APP_VERSION" --generate-notes
          if($LASTEXITCODE -ne 0){throw 'Release creation failed'}
          if($env:APP_VERSION.Contains('-')){gh release edit $tag --prerelease}
          gh release edit $tag --draft=false
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}

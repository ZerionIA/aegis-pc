name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Aegis.sln --locked-mode

    - name: Build solution
      run: dotnet build Aegis.sln -c Release --no-restore

    - name: Run automated test suite
      run: dotnet run --project tests/Aegis.Tests -c Release --no-build -- tests/Aegis.Tests/bin/test-data